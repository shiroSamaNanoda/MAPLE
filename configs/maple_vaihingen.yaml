# MAPLE on Vaihingen.
#
# Every pluggable component (model, dataset, loss, optimizer, scheduler)
# is selected by `name:` and configured by `params:`.

model:
  name: maple
  params:
    sam3_checkpoint_path: ./pretrained/sam3.pt
    clip_model_name:      ViT-B-32
    clip_checkpoint_path: ./pretrained/RemoteCLIP-ViT-B-32.pt
    safr_loss_weight:     0.1
    safr_warmup_steps:    100

dataset:
  name: isprs
  params:
    preset:      Vaihingen
    data_root:   /data/ISPRS
    window_size: [256, 256]
    cache:       true
    augmentation: true

loss:
  name: cross_entropy
  params:
    ignore_index: 255

optimizer:
  name: sgd
  base_lr: 0.01
  params:
    momentum:     0.9
    weight_decay: 5.0e-4
  # Extras forwarded to model.param_groups(base_lr=..., **extras).
  # MAPLE uses this to put the VLP (RemoteCLIP) sub-encoder on a slower LR.
  param_group_extras:
    vlp_lr_scale: 0.1

scheduler:
  name: multistep
  params:
    milestones: [25, 35, 45]
    gamma:      0.1

training:
  epochs:        50
  batch_size:    4
  num_workers:   4
  save_dir:      ./weights
  save_every:    1
  log_interval:  100

extras:
  # MAPLE-only: log SAFR class-weight dynamics + plot after training.
  safr_logger:        true
  safr_log_interval:  10
  vis_dir:            ./vis_safr
